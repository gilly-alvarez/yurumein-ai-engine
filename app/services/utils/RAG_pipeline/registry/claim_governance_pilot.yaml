# Audit tool: Direct PDF inspection via pdftotext; LIBRO I and II read verbatim;
#             nodes.py routing logic inspected; lexicon CSV queried for 'father'.
# Language Overview: EV06 SATISFIED — owner queried production PGVector directly on VPS
#   (2026-08-10); all 6 chunks confirmed present (pages 0–2); text inspected during audit.
#   Source remains Tier U: authorship and provenance still unknown. RP08 still applies.
#
# DO NOT:
#   - modify nodes.py, workflow.py, prompt.py, lexical_parser.py, lexicon.py
