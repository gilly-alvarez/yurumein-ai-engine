# Phase 3: Contested & Weak Claim Governance
#
# STATUS: PHASE 3 CLOSED — governance design complete; RP01–RP11 approved.
#         Not runtime production logic. Phase 4 implementation pending.
#
# HOW TO READ THIS FILE:
#   Each claim was extracted verbatim or closely paraphrased from ingested sources.
#   "best_available_source" = the source with the highest domain_authority for
#   this claim type, regardless of whether it supports or contradicts the claim.
#   "recommended_response_behavior" = behavioral guidance only; not yet implemented.
#
# Created:    2026-08-10
# Revised:    2026-08-10 (cross-source comparison added; P001/P002 production cases added)
#             2026-08-10 (EV06 production verified; RP09/RP10/RP11 approved; Phase 3 closed)
