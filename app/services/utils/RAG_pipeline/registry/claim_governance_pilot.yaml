# SECTION D: STEP 5 PILOT — GARÍFUNA ORIGIN NARRATIVE (REVISED)
# ---------------------------------------------------------------------------

storage_recommendation:

  recommended: YAML file (this file)
  rationale: >
    At this stage, lean governance design: a YAML file in the existing registry
    directory alongside source_registry.yaml is the right choice because:
    (1) No new infrastructure required — same format as source_registry.yaml
    (2) Version-controllable alongside source definitions
    (3) Human-readable for owner review
    (4) Easily converted to a DB schema when retrieval governance is implemented
    Rejected alternatives:
    - Markdown note: less structured for future automated policy lookup
    - PostgreSQL table: premature — no runtime logic exists yet; migration before
      policy design wastes effort and creates schema debt
  future_path: >
    When source-aware retrieval is implemented in nodes.py/workflow.py, the
    claim_id, contested_status, and recommended_response_behavior fields in this
    file can seed a PostgreSQL claim_governance table. The YAML is designed with
    that migration in mind.
  file_location: >
    app/services/utils/RAG_pipeline/registry/claim_governance_pilot.yaml
  mark_as: PILOT — governance design only, not runtime production logic

