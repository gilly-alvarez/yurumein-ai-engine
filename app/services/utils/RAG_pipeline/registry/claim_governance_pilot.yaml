# ---------------------------------------------------------------------------
# SECTION G: PRODUCTION CASES — EVIDENCE GOVERNANCE FAILURES
# Two cases derived from observed production chatbot behavior.
# These are governance audit findings, not implementation tasks.
# ---------------------------------------------------------------------------

production_cases:

  - case_id: P001
    title: "Dügü — Definition, Location, and Confusion with Dabuyaba"
    production_question: "What is the Dügü?"
    production_behavior_reported: >
      Chatbot answered that Dügü refers to a "ceremonial center" and used
      "Dabuyaba" as supporting evidence.
    governance_failure_type:
      - RELEVANT ≠ SUPPORTS CLAIM
      - SOURCE MENTION ≠ DEFINITION
      - MODEL INFERENCE ≠ SOURCE FACT

    corpus_evidence:
      from_libro_garifuna_ii:

        - location: "Page 6, Sisi — ritual list"
          verbatim: >
            "también se realizan actos y ritos a ellos o sea a aquellos quienes han
            partido a otra vida y entre los ritos más relevantes y practicados podemos
            mencionar: El Chugu, el Dÿgÿ, Abeimahani, Arumahani, ÿnñurahani y otras más."
          interpretation: Dügü is a RITUAL/CEREMONY in the list of ancestral practices.

        - location: "Page 6, Sisi — dance list"
          verbatim: >
            "sus danzas figuran: El Hüngünhügü, Dÿgÿ, Arumahani y otros."
          interpretation: >
            Dügü is also listed as a DANCE. The same source categorizes it under
            both rituals and dances — ambiguity within LIBRO II itself.

        - location: "Houses section (Tipos de Casas Utilizados por los Garifunas)"
          verbatim: >
            "Casa en donde se realiza ceremonia ancestral Dügÿ,    Gayunari
             Casa en donde se realiza ceremonia ancestral Chugu,   Dabuyaba"
          interpretation: >
            CRITICAL: The house for the Dügü ceremony is called GAYUNARI.
            The house for the Chugu ceremony is called DABUYABA.
            Dabuyaba ≠ Dügü. Dabuyaba is associated with CHUGU, not Dügü.

        - location: "Vocabulary section (monosyllabic/short words exercise)"
          verbatim: "dabuyaba = centro ceremonial garífuna"
          interpretation: >
            The vocabulary section defines Dabuyaba generically as "Garífuna
            ceremonial center" without specifying which ceremony. This generic
            definition is the likely source of the production error.

      from_libro_garifuna_serie_i:
        - location: "Monosyllabic words section"
          verbatim: "Dabuyaba / Dabuyaba / Centro ceremonial garifuna"
          interpretation: >
            LIBRO SERIE I also defines Dabuyaba as "ceremonial center" without
            ceremony-specific context. Neither Book supports using "Dabuyaba" as
            a definition or synonym for "Dügü."

    governance_analysis: >
      What the production RAG likely retrieved: a chunk containing "dabuyaba =
      centro ceremonial garífuna" from LIBRO I or II vocabulary sections. This
      chunk is RELEVANT to a query about Garífuna ceremonies but does NOT define
      Dügü. The model then generated "Dügü is a ceremonial center" by conflating
      the retrieved term with the queried term.

      Failure classification:
        RELEVANT ≠ SUPPORTS CLAIM: The chunk about Dabuyaba is relevant to Garífuna
          cultural practices but does not support the claim that Dügü is a ceremonial
          center.
        SOURCE MENTION ≠ DEFINITION: Dabuyaba and Dügü both appear in the source
          documents. Their co-presence does not make them synonymous.
        MODEL INFERENCE ≠ SOURCE FACT: No source defines Dügü as a ceremonial center.
          The model inferred this by associating the retrieved "ceremonial center"
          definition with the queried term "Dügü."

      WHAT THE SOURCES ACTUALLY SAY:
        Dügü = an ancestral ceremony (LIBRO II, ritual list)
        Dügü = also a dance (LIBRO II, dance list) — intra-source ambiguity
        Gayunari = the house/building where the Dügü ceremony is performed
        Dabuyaba = the house/building where the CHUGU ceremony is performed
          (also generically labeled "ceremonial center" in vocabulary sections)

      INTRA-SOURCE AMBIGUITY NOTE: LIBRO II lists Dügü under BOTH rituals and dances.
      The corpus does not fully resolve whether Dügü is primarily a ceremony, a dance,
      or a ceremony that includes dance elements. This ambiguity should be reflected
      in any response about Dügü.

    risk: HIGH
    # Presenting Dügü as a "ceremonial center" (a PLACE) instead of a ceremony
    # (a PRACTICE) fundamentally mischaracterizes a sacred ancestral practice.
    # This is a high-consequence cultural accuracy failure.

    recommended_response_behavior: >
      Cite sources precisely. Do not conflate Dabuyaba with Dügü.
      "The Dügü is described in available sources as an ancestral ceremony and a
      traditional dance, performed as part of Garífuna spiritual practice. The
      ceremonial building associated with the Dügü is called the Gayunari. The
      Dabuyaba is a different ceremonial structure, associated with the Chugu
      ceremony, not the Dügü." Note: if the source ambiguity between ceremony and
      dance cannot be resolved, acknowledge it: "Available sources describe Dügü
      both as a ritual and as a dance form."

    governance_rules_triggered: [RP02, RP04]
    approved_rule: >
      RP09 (APPROVED 2026-08-10): TERM CONFLATION — When a retrieved chunk defines
      Term A and the query asks about Term B, do not use Term A's definition for
      Term B, even if A and B appear in related source contexts. Require the
      definition to explicitly name the queried term.

  - case_id: P002
    title: "Father — Routing Divergence and Authority Path Inconsistency"
    production_questions:
      - question_a: "How do you say father in garifuna"
        response_a: "The available documents do not provide enough information..."
      - question_b: "How do you say father??"
        response_b: "The word for 'father' in Garifuna is 'Pa.'"
    governance_failure_type:
      - ROUTING DIVERGENCE — semantically equivalent queries take different authority paths
      - LEXICON MISS + RAG SILENT PATH produces "no information" response
      - RAG-ONLY PATH produces answer with documentary evidence from Tier B source

    routing_analysis:
      from_nodes_py: nodes.py:231-248 global_retrieval_process()
      query_a_path: >
        1. parse_lexical_request("How do you say father in garifuna") → MATCHES
           pattern "how_do_you_say", term="father", language="english"
        2. YurumeinLexicon().lookup("father", "english") → 0 results
           ("father" not in yurumein_lexicon_469.csv — lexicon covers A–An only)
        3. if rows: block is SKIPPED (empty list is falsy)
        4. Falls through to: _vector_retrieve(query="How do you say father in garifuna")
        5. RAG query = full sentence including "in garifuna"
        6. Production result: "not enough information" — RAG did not surface "Pa" chunk
      query_b_path: >
        1. parse_lexical_request("How do you say father??") → NO MATCH
           (pattern requires "in gar[ií]funa\b" suffix; "??" terminates early)
        2. Falls directly to: _vector_retrieve(query="How do you say father??")
        3. RAG query = "How do you say father??" — no "garifuna" signal in query
        4. Production result: "Pa" — RAG surfaced relevant chunk

    documentary_evidence_for_pa:
      from_libro_garifuna_serie_i:
        location: "Monosyllabic words section, page 53"
        verbatim: >
          "PALABRAS MONOSILABAS EN IDIOMA GARIFUNA
           Pa    Pa (Papá)"
        note: >
          "Pa" is listed as the Garífuna monosyllabic word for "Pa (Papá/father)."
          This appears in a vocabulary table in LIBRO SERIE I (Tier B overall,
          lexical Tier C). The word "Pa" has documentary support in the corpus.
      from_libro_garifuna_serie_ii:
        location: "Short words section, page 52-53"
        verbatim: "Pa / Pa (Papá) — appears in same monosyllabic vocabulary list"
        note: >
          Same vocabulary item appears in LIBRO II. The "Pa = father/Papá" pairing
          is documented in two sources.
      lexicon_status: >
        "father" is NOT in yurumein_lexicon_469.csv (lexicon covers A–An pilot only).
        spanish "padre" is also not in the lexicon CSV.

    governance_analysis: >
      The answer "Pa" appears to be documentarily correct — it IS in the corpus
      (LIBRO I and LIBRO II, Tier B sources, lexical Tier C). This is not a case
      where RAG produced a hallucinated answer. The answer has source backing.

      THE GOVERNANCE FAILURE is in the routing, not the answer:
        (a) Query A takes the lexical path, which correctly identifies this as a
            translation request, correctly looks up "father" in the lexicon,
            correctly finds nothing (lexicon is incomplete), but then falls through
            to RAG with the full query string "How do you say father in garifuna."
            The RAG query includes "in garifuna" which may steer vector similarity
            toward language-description chunks rather than vocabulary chunks.
        (b) Query B bypasses the lexical path entirely (different phrasing) and
            the shorter RAG query "How do you say father??" may retrieve vocabulary
            chunks more effectively.
        (c) The user's INTENT is identical in both cases. The path taken determines
            the answer quality.

      CRITICAL ROUTING GAP: When the lexical parser matches but lexicon returns 0
      results, nodes.py falls through to RAG with the FULL ORIGINAL QUERY (line 241).
      It does not use the EXTRACTED TERM ("father") as the RAG query. A targeted
      RAG query on just "father" or "padre" would likely have retrieved the "Pa"
      chunk in both cases.

    additional_gap: >
      The lexicon covers only A–An (469 entries). Common basic vocabulary like
      "father/padre" (Pa) is absent from the lexicon entirely. This means all
      "father"-type queries that DO match the lexical parser will silently miss
      the lexicon and fall to RAG — without any indication to the user that the
      lexicon was checked and found incomplete rather than the word not existing.

    risk: MEDIUM-HIGH
    # "No information" response to a valid translation query that has a documented
    # answer in the corpus is a user trust failure. The user is likely to assume
    # the information doesn't exist in Garífuna rather than that the system had
    # a routing issue.

    recommended_response_behavior: >
      This is a routing/implementation finding, not a content dispute.
      Governance note: When lexical parser matches but lexicon returns 0 results,
      the system should either:
        (a) Fall through to RAG with the EXTRACTED TERM (not full query), OR
        (b) Surface a "not in structured lexicon, checking broader sources" message
            before going to RAG, OR
        (c) Allow the LLM to note explicitly: "This word is not in our structured
            Garífuna lexicon. Based on available documents..."
      Until routing is fixed, "father" queries that use the canonical pattern may
      fail while equivalent non-canonical phrasings succeed.

    governance_rules_triggered: [RP02]
    approved_rule: >
      RP10 (APPROVED 2026-08-10): LEXICON MISS GOVERNANCE — When a lexical request
      is recognized but the structured lexicon contains no entry, Yurumein must
      distinguish "not found in the structured lexicon" from "no Garífuna term exists."
      It may search approved language sources as secondary evidence. The specific
      retrieval technique is a Phase 4 implementation decision; this rule governs
      the behavioral outcome only.

# ---------------------------------------------------------------------------
# SECTION H: REVISED POLICY CHECK — RP01-RP08 STATUS AFTER PRODUCTION CASES
# ---------------------------------------------------------------------------

revised_policy_check:

  rp01_through_rp08_still_hold: true
  notes: >
    RP01-RP08 remain valid as stated. Production cases P001 and P002 expose two
    additional governance gaps not covered by the original eight rules.

  new_rules_approved:

    - rule_id: RP09
      status: APPROVED (2026-08-10)
      scenario: Term conflation from co-occurring retrieved chunks
      definition: >
        Retrieved chunk defines Term A. Query asks about Term B. Terms co-occur
        in the corpus. Model produces definition of Term B using Term A's definition.
      behavior: >
        A definition for Term A must never be transferred to Term B merely because
        the terms co-occur or are contextually related. A chunk about Dabuyaba does
        not define Dügü, even if both appear in the same source documents.
      triggered_by: P001 (Dügü / Dabuyaba conflation)

    - rule_id: RP10
      status: APPROVED (2026-08-10)
      scenario: Lexical request recognized but no structured lexicon entry found
      definition: >
        The lexical parser recognizes a translation request, but the structured
        Yurumein lexicon contains no entry for the queried term.
      behavior: >
        Yurumein must distinguish "not found in the structured lexicon" from "no
        Garífuna term exists." When the lexicon returns no entry, Yurumein may
        search approved language sources as secondary evidence. The response must
        not imply the term has no Garífuna equivalent solely because the lexicon
        is incomplete.
      implementation_note: >
        The specific retrieval technique (query rewrite, fallback path logic) is a
        Phase 4 implementation decision. This rule governs the behavioral outcome only.
      triggered_by: P002 (father routing divergence)

    - rule_id: RP11
      status: APPROVED (2026-08-10)
      scenario: Intra-source ambiguity — same source gives multiple or conflicting
        classifications for the same entity
      definition: >
        An authoritative source classifies or describes the same entity under more
        than one category, or provides contradictory descriptions within the same
        document.
      behavior: >
        Yurumein must preserve and disclose the ambiguity rather than silently
        resolving it. Present both descriptions with attribution. Do not synthesize
        a single answer that papers over the source's own inconsistency.
      triggered_by: P001 (Dügü listed as both ritual and dance in LIBRO II)

