external_verification_required:

  priority: HIGH
  note: >
    Do not perform this research as part of this task.
    This list is for future phases — academic historiography, institutional sources,
    community oral/history authorities, linguistic scholarship.

  items:

    - item_id: EV01
      claim_ids: [C001, C002, C003, C004]
      topic: Garífuna origin narrative and St. Vincent chronology
      research_against:
        - Academic historiography on Black Caribs / Garinagu (e.g., Nancie Gonzalez,
          Joseph Palacio, Mark Anderson)
        - Official institutional sources (UNESCO, national archives of Honduras,
          Belize, Guatemala)
        - Community oral history authorities (CONPAH, OFRANEH, SATIIM)
      key_questions:
        - What is the accepted date range for African presence in St. Vincent?
        - What is the scholarly consensus on mixing/non-mixing in St. Vincent?
        - Who expelled the Garinagu in 1797: British military or Afrodescendientes?
        - Is "Marcos Sánchez Díaz / Haitian Army" documented in historical records?
        - What is the documented arrival date(s) in Guatemala?

    - item_id: EV02
      claim_ids: [C005]
      topic: Language composition percentages
      research_against:
        - Linguistic scholarship on Island Carib / Garífuna (e.g., Hoff 1968,
          Taylor 1951, 1977)
        - UNESCO language documentation reports
      key_questions:
        - What methodology do linguists use to determine lexical composition?
        - Do accepted linguistic sources give percentages comparable to 45/25/15/10/5?
        - Is "5 Spanish technical words" a recognized characterization?

    - item_id: EV03
