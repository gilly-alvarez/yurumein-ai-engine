# Yurumein AI — RAG Source Registry
# Phase 2: Source Governance Foundation
#
# This file is the authoritative registry for all documents ingested into
# Yurumein's production PGVector collection (document_collection / yurumein_test).
#
# AUTHORITY TIERS:
#   A — Primary reference for the designated domain. Most reliable available
#       source. Does not imply academic peer review.
#   B — Strong secondary / instructional. Identifiable authorship and external
#       publication, but instructional format or meaningful provenance gaps.
#       Useful for context and corroboration; not sole basis for factual claims.
#   C — Contextual / derivative / small-scope. Internally created, derived from
#       another source, or too limited in scope for primary authority.
#   U — Unverified / uninspectable. Provenance, content, and/or author unknown.
#
# DOMAIN AUTHORITY RATINGS (per domain, same A/B/C/U scale):
#   N/A — Source does not address this domain at all.
#
# VERIFICATION STATUS:
#   verified            — Content origin confirmed; chain of custody clear.
#   source inspected    — Source document directly inspected; classification based
#                         on inspection. Provenance gaps may remain.
#   partially-verified  — Author confirmed; one or more provenance gaps remain.
#   unverified          — Insufficient evidence to confirm any provenance.
#
# DO NOT modify chunk_count — it reflects the production PGVector state at
# the time this registry was created (2026-08-09). Update after re-ingestion.
# DO NOT change source_path — it must match cmetadata.source in PGVector exactly.
#
# Last updated: 2026-08-10 (full 469-row automated comparison complete; Source #6 notes updated)
# Populated by: Initial Phase 2 Source Inspection (Claude Code)
# Governance review: owner review applied 2026-08-09 — see correction notes inline.
# Human review required before any field marked UNKNOWN can be promoted.

# ---------------------------------------------------------------------------
# PROVENANCE RULES — Data origin classification for Yurumein AI
# Applies to all derived data in yurumein_lexicon and related pipeline tables.
# Last updated: 2026-08-09
# ---------------------------------------------------------------------------
#
# These rules govern how fields in Yurumein's derived data (yurumein_lexicon,
# CSV, SQL tables) should be attributed when presented to users or auditors.
#
# SOURCE-BACKED
#   The following field types are directly supported by the ingested source
#   documents and may be attributed to the source:
#     - Spanish vocabulary/terms
#     - Garífuna vocabulary/forms
#     - Source page references (e.g., "see page N of DICCIONARIO")
#     - Grammatical or orthographic information explicitly stated in the source
#     - Language information explicitly stated by the source
#
# YURUMEIN-DERIVED
#   The following field types were added by Yurumein's data-processing or
#   transformation layer and are NOT backed by any current source document:
#     - English translations — unless independently supported by a separate
#       authoritative source (none currently in collection)
#     - Normalized lookup fields (e.g., lowercase slugs, accent-stripped keys)
#     - Internal record IDs (lexicon_id, chunk_id, etc.)
#     - Processing metadata (import date, batch, confidence score, etc.)
#
# CONSEQUENCE: any English vocabulary presented to a user that originates from
# yurumein_lexicon must be attributed as Yurumein-derived, not as a translation
# claim backed by the DICCIONARIO GARIFUNA or any other source in this registry.
# ---------------------------------------------------------------------------

sources:

  - source_id: diccionario-garifuna
    canonical_title: "DIMUREI AGEI - Enriquez"
    spanish_title: "Diccionario Enriquez"
    filename: "DICCIONARIO GARIFUNA.pdf"
    source_path: "app/services/utils/RAG_pipeline/data/new_docs/DICCIONARIO GARIFUNA.pdf"
    file_type: pdf
    source_type: bilingual dictionary / lexical reference
    author: "Elmer Mauricio Enríquez Bermúdez"
    publisher: "Editoriales C&J'J Enríquez"
    publication_year: 2020
    languages:
      - spanish
      - garifuna
    translation_direction: "Spanish → Garífuna"
    domains:
      - lexical
      - grammar
    provenance: >
      Author-created Garífuna reference work. Research described by author as
      conducted approximately 2013–2019; digital edition published in 2020.
      Self-published by Editoriales C&J'J Enríquez, the author's own publishing
      house. Offices in New York, USA and Livingston (Barrio Pueblo Nuevo),
      Guatemala. Affiliated with ASOIHIGA (email: ASOIHIGA@YAHOO.COM; full
      organization name not spelled out in document). PDF produced with Microsoft
      Word 2016, finalized 2020-06-27. PDF /Author metadata field reads 'Kelvin'
      — likely the person who exported the file, not the content author (see notes).
      No external academic endorsement found within the document.
    overall_tier: B
    domain_authority:
      lexical: A
      grammar: B
      historical: "N/A"
      musical: "N/A"
      general: B
    authority_notes: >
      overall_tier B, domain lexical A. These two ratings mean different things
      and must not be collapsed.

      LEXICAL A: This is Yurumein's primary available lexical authority for
      Spanish → Garífuna vocabulary. It is the most comprehensive vocabulary
      source in the collection (206 pages, grammatically classified entries,
      ~4,972 chunks) and the explicit foundation for the Phase 1 lexicon pipeline.
      For vocabulary and translation queries in the Spanish → Garífuna direction,
      it is the first retrieval candidate and the strongest available evidence.

      OVERALL B: The source is self-published by the author's own house, single-
      author, no bibliography, no evidence of peer review, and contains an
      unexplained dual Garifuna column format with unresolved chain-of-custody
      questions (PDF /Author: 'Kelvin'). These factors mean it does not meet the
      bar for externally established authoritative source. "Best source Yurumein
      currently possesses" and "externally validated authority" are not the same
      claim. Overall B preserves that distinction.

      Tier B for grammar: grammatical framework (abbreviation table, alphabet) is
      present but limited — not a systematic grammar. N/A for historical and
      musical: document does not address these domains.

      LANGUAGE SCOPE: This source is a Spanish → Garífuna bilingual dictionary.
      It is NOT an English source and must not be treated as English lexical
      authority. Any English translations in yurumein_lexicon were added by
      Yurumein's pilot data-processing layer and are Yurumein-derived — they are
      not source-backed by this dictionary. See provenance_rules section.
    intended_uses:
      - Spanish → Garífuna lexical evidence
      - Documented Garífuna vocabulary and forms
      - Orthographic evidence when explicitly present in the source
      - Language information explicitly stated by the source
      - Grammatical classification reference (parts of speech)
      - First retrieval candidate for vocabulary or translation queries
    restricted_uses:
      - English lexical authority
      - English → Garífuna source
      - Independent authority for claims outside what the work documents
      - Sole authority for historical or cultural claims (document contains none)
      - Authority for claims contested by community or academic sources
      - Sole authority for phonological rules (grammar section is minimal)
    verification_status: source inspected
    page_count: 206
    chunk_count: 4972
    notes: >
      TWO-COLUMN FORMAT — RESOLVED (2026-08-09):
      The dictionary has three columns per entry:
        1. IDIOMA ESPAÑOL — Spanish headword + grammatical classification
        2. SIGNIFICADO EN IDIOMA GARIFUNA — the orthographic/written Garífuna form
        3. PRONUNCIACIÓN — Spanish-phonological transcription guide (how to say
           the Garífuna word using Spanish phonological conventions)
      The two columns are NOT orthographic variants or dialectal forms. They are
      the same Garífuna word written in (a) its proper orthographic form and
      (b) a Spanish-reader pronunciation guide. The principal difference:
      Garífuna 'h' sounds like Spanish 'j', so SIGNIFICADO uses 'h' while
      PRONUNCIACIÓN substitutes 'j'. Other substitutions follow the same pattern
      (n → nj, h → j at word boundaries, â → âa for double pronunciation, etc.).
      CONSEQUENCE: the Yurumein lexicon correctly extracted from the SIGNIFICADO
      column. See yurumein-lexicon-pilot notes for confirmation and character
      fidelity details.
      OPEN: PDF /Author field 'Kelvin' — who is this person and their relationship
      to the document? Clarify full name and standing of ASOIHIGA organization.

