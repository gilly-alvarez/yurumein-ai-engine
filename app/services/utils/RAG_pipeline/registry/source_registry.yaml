# Yurumein AI — Source Registry
#
# Records provenance, authorship, copyright status, and permission state
# for every document indexed in the production RAG corpus.
#
# PERMISSION CLASSIFICATIONS:
#   author_permission_reported  — Yurumein AI founder confirms the author gave
#                                 verbal/personal authorization; written record
#                                 not yet obtained.
#   permission_unknown          — No permission record exists. Source is
#                                 retrievable but authorization is unverified.
#   restricted                  — Blocked from public retrieval. Requires
#                                 explicit editorial approval before release.
#
# TIER CLASSIFICATIONS (see claim_governance_pilot.yaml §Tier):
#   A  — Primary domain-authoritative source (lexical authority for vocabulary)
#   B  — Secondary authoritative source (community-authored, partially verified)
#   C  — Provisional source (locked pending further review)
#   U  — Unknown provenance (authorship or origin unverified)
#
# DO NOT:
#   - treat permission_state as a legal clearance
#   - infer redistribution rights from author_permission_reported alone
#   - change publication_allowed flags without explicit owner authorization
#   - use this file as runtime logic (it is governance documentation only)
#
# Created:  2026-11-14
# Updated:  2026-11-14
# ---------------------------------------------------------------------------

