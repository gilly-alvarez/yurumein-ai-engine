    chunk_count: 39
    notes: >
      COLUMN EXTRACTION CONFIRMED — FULL 469-ROW COMPARISON (2026-08-10):
      Automated comparison of all 469 CSV garifuna values against the DICCIONARIO
      SIGNIFICADO EN IDIOMA GARIFUNA column (pages 8–20). Results:
        Total CSV rows               : 469
        Not found in dict pages 8-20 :  82  (expected — gender variants, pronoun
                                              conjugations, '(var.)' extensions,
                                              and phrases beyond basic headwords)
        Matched in dict              : 387
          Confirmed correct SIGNI    : 367  (94.8% of matched entries)
          Genuine exceptions         :  20

      CONFIRMED WRONG COLUMN (1 entry):
        Albino — CSV='Liróü weyu' matches PRONUNCIACIÓN; correct SIGNIFICADO is
        'Liráü weyu'. Confirmed wrong-column extraction for this entry (ó vs á).

      CHARACTER SUBSTITUTION (~8-10 entries, same classes as prior findings):
        â → á  : Abortar (Ágüriâgua→Ágüriágua), Agua caliente (sûti→süti)
        ê → ë  : Aborrecer (Íyerêgun→Íyerëgun)
        accent missing: Animal (Anímalu→Animalu), Amarga (Gífitu→Gifitu),
                        Ahijada (Iámasiri→Íamasiri)
        vowel diff: Angosta (Bürüraüraütu→Bürüraürütu)
      No new substitution class found beyond ÿ→Y, â→á, ñ→n already documented.
      These are DOCX creation artifacts, not column selection errors.

      FORM DIFFERENCES (4 notable entries):
        Aclarar — CSV has 'Apúleinida' not found in dict pages 8-20;
          'Arugougada' is a compressed form of dict's 'Arugoundagüda'.
          Possible: 'Apúleinida' is from a different section or is a pilot add.
        Además  — CSV='Gama lumoun....' has trailing ellipsis chars (cosmetic
          artifact); Garífuna value 'Gama lumoun' matches correctly.
        Alemán/Alemana/Alemania — CSV uses condensed parenthetical form; dict has
          verbose form. Garífuna core word 'Yámani' is identical in both.
        Angosta — CSV='Bürüraürütu'; dict='Bürüraüraütu, Bürüraütu'.
          Possible alternate valid form or vowel compression artifact.

      MULTIPLE FORMS PER SPANISH ENTRY (confirmed at scale):
        The DICCIONARIO sometimes has multiple entries for the same Spanish headword.
        Example: 'Adorar' appears twice — SIGNI 'Ahinsiñeda' (first) and
        SIGNI 'Alawaha' (second). The pilot captured one instance per headword;
        both forms are linguistically valid. The uncaptured form is absent from
        the SQL lexicon. This is a systematic gap across the pilot, not an error.

      82 NOT-FOUND ENTRIES (expected, not errors):
        These CSV entries have no basic headword match in dict pages 8-20 because
        they represent pronoun conjugations (Acerca de él/ella/ti/ustedes),
        gendered variants (Adolescente hombre/mujer), temporal phrases (Ahora,
        Anoche), locative phrases (A casa, A casa de él), seasonal names (Agosto),
        loanword entries (Achiote), and (var.) alternates. These are pilot
        extensions beyond basic dictionary headwords — appropriately included in
        the lexicon but outside the scope of this source comparison.

      DESIGN RULE (confirmed by this audit):
        NEVER ingest the PRONUNCIACIÓN column into the canonical garifuna field.
        SIGNIFICADO is the orthographic lexical source; PRONUNCIACIÓN is separate
        metadata. Applies to all future A-Z scaling.

      OPEN: Who created this document (dc:creator 'Un-named')? Creator identity
      required for audit trail. The 39 RAG chunks may produce retrieval noise
      competing with diccionario-garifuna chunks for the same A–An entries.
      Consider restricting RAG inclusion to the lexicon SQL table only (future).

